services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodsys_local}
      POSTGRES_USER: ${POSTGRES_USER:-foodsys_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copia .env.example a .env para las pruebas locales}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - foodsys_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  foodsys_pg_data:
